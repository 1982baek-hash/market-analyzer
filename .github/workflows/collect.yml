name: 상권 데이터 자동 수집

on:
  schedule:
    # GitHub 일정은 UTC 기준. 일요일 18:17 UTC = 월요일 03:17 한국시간
    - cron: "17 18 * * 0"
  workflow_dispatch: # Actions 탭에서 'Run workflow' 버튼으로 바로 실행

permissions:
  contents: write # 수집 결과를 저장소에 커밋하기 위해 필요

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 첫 실행은 인허가 전체 이력을 받아서 오래 걸린다
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: 패키지 설치
        run: pip install -r requirements-pipeline.txt

      - name: 저장소에 올라간 캐시 파일 정리
        run: git ls-files -z | grep -z "__pycache__" | xargs -0 -r git rm --cached --quiet || true

      - name: 공공데이터 수집
        id: collect
        continue-on-error: true
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          SGIS_CONSUMER_KEY: ${{ secrets.SGIS_CONSUMER_KEY }}
          SGIS_CONSUMER_SECRET: ${{ secrets.SGIS_CONSUMER_SECRET }}
        run: python -m pipeline.run

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/mart
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "데이터 자동 수집 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase --quiet  # 실행 중에 다른 커밋이 올라왔어도 충돌 없이 이어 붙인다
          git push

      - name: 수집 실패 알림
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::일부 데이터 수집에 실패했습니다. '공공데이터 수집' 단계 로그를 확인하세요. 실패한 소스는 이전 데이터를 그대로 유지합니다."
          exit 1
